[project]
name = "threat-intelligence-automation"
version = "0.1.0"
description = "Automated Threat Intelligence & IOC Enrichment Platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

